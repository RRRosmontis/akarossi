<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#161616">
  <title>Rossi Mail</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.rrrosmontis.icu/rossi/favicon-84a4ba4f496d.svg">
  <link rel="preconnect" href="https://cdn.rrrosmontis.icu" crossorigin>
  <link rel="preload" href="https://cdn.rrrosmontis.icu/rossi/saira-9d050fc5a01c.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/mail/styles.css?v=4">
  <script src="/mail/app.js?v=8" defer></script>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3M14 5h4a2 2 0 0 1 2 2v3"/><path d="m17 7 3 3 3-3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 11m16 2-2 4.5A7 7 0 0 1 5.5 15"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 14h4l2 3h4l2-3h4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/></symbol>
    <symbol id="i-outbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="m5.5 5.5 1-3h11l1 3L22 12v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7Z"/><path d="M7 13 17 3m-5 0h5v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 20V9"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="m9 17-7-5 7-5v3c8 0 11 3 13 9-3-5-7-5-13-5Z"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m15 17 7-5-7-5v3C7 10 4 13 2 19c3-5 7-5 13-5Z"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 1 1-2.8-2.8l8.9-8.9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><path d="M8 4v6M16 14v6"/><path d="M5 4h6v6H5zM13 14h6v6h-6z"/></symbol>
  </svg>

  <main id="login-view" class="login-view">
    <div class="login-shell">
      <section class="login-intro" aria-labelledby="login-title">
        <span class="eyebrow">// MAIL CLIENT</span>
        <h1 id="login-title">ROSSI <span>MAIL</span></h1>
        <p>邮件收发、搜索与转发设置</p>
        <div class="tri-bar" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="function-rotator" aria-hidden="true">
          <span>FUNCTION</span>
          <span class="rotator-window"><span class="function-rotator-text">INBOX</span></span>
        </div>
      </section>
      <section class="login-card glass" aria-label="邮箱登录">
        <div class="card-heading"><span class="eyebrow">// SIGN IN</span><h2>邮箱登录</h2></div>
        <form id="login-form" class="stack">
          <label class="field">
            <span>邮箱密钥</span>
            <input id="api-key" name="key" type="password" autocomplete="current-password" required autofocus>
          </label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="button primary full cut-button" type="submit">登录</button>
          <details class="api-settings">
            <summary>服务器设置</summary>
            <label class="field">
              <span>API 地址</span>
              <input id="api-base" name="apiBase" type="url" inputmode="url" required spellcheck="false">
            </label>
          </details>
        </form>
      </section>
      <figure class="login-artwork" aria-hidden="true">
        <img src="https://cdn.rrrosmontis.icu/rossi/rossi-c6ba909ef9dc.webp" alt="" decoding="async">
      </figure>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">ROSSI <strong>MAIL</strong></span>
      </div>
      <div class="function-rotator" aria-hidden="true">
        <span>FUNCTION</span>
        <span class="rotator-window"><span class="function-rotator-text">INBOX</span></span>
      </div>
      <form id="search-form" class="search" role="search">
        <svg class="icon"><use href="#i-search"></use></svg>
        <label class="sr-only" for="search-input">搜索邮件</label>
        <input id="search-input" type="search" placeholder="搜索发件人、主题或内容" autocomplete="off">
      </form>
      <div class="top-actions">
        <span id="account-label" class="account-label"></span>
        <button id="refresh-button" class="icon-button" type="button" title="刷新" aria-label="刷新">
          <svg class="icon"><use href="#i-refresh"></use></svg>
        </button>
        <button id="logout-button" class="button subtle logout-button cut-button" type="button">
          <svg class="icon"><use href="#i-logout"></use></svg><span>退出</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar glass" aria-label="邮箱导航">
        <button class="button primary full compose-button cut-button" type="button" data-action="compose">
          <svg class="icon"><use href="#i-compose"></use></svg>写邮件
        </button>
        <nav id="folder-nav" class="folder-nav">
          <span class="nav-section-label">// MAILBOX</span>
          <button type="button" data-folder="inbox" class="nav-item active"><svg class="icon"><use href="#i-inbox"></use></svg><span>收件箱</span><small>INBOX</small></button>
          <button type="button" data-folder="sent" class="nav-item"><svg class="icon"><use href="#i-send"></use></svg><span>已发送</span><small>SENT</small></button>
          <button type="button" data-folder="trash" class="nav-item"><svg class="icon"><use href="#i-trash"></use></svg><span>垃圾箱</span><small>TRASH</small></button>
          <button type="button" data-folder="all" class="nav-item"><svg class="icon"><use href="#i-all"></use></svg><span>全部邮件</span><small>ALL</small></button>
          <details class="status-folders">
            <summary><span>发件状态</span><small>2</small></summary>
            <div class="status-folder-list">
              <button type="button" data-folder="outbox" class="nav-item"><svg class="icon"><use href="#i-outbox"></use></svg><span>发件箱</span><small>OUTBOX</small></button>
              <button type="button" data-folder="failed" class="nav-item"><svg class="icon"><use href="#i-alert"></use></svg><span>发件失败</span><small>FAILED</small></button>
            </div>
          </details>
        </nav>
        <div class="sidebar-micro" aria-hidden="true">ROSSI MAIL / REV 2026.11</div>
        <button type="button" class="nav-item routing-nav" data-action="routing">
          <svg class="icon"><use href="#i-settings"></use></svg><span>邮箱设置</span><small>SETTINGS</small>
        </button>
      </aside>

      <section id="list-panel" class="list-panel glass" aria-label="邮件列表">
        <div class="panel-heading">
          <div class="panel-title"><span id="folder-eyebrow" class="eyebrow">// INBOX</span><h2 id="folder-title">收件箱</h2></div>
          <span id="message-count" class="count"></span>
        </div>
        <label class="mobile-folder-nav" for="mobile-folder-select">
          <span>文件夹</span>
          <select id="mobile-folder-select">
            <option value="inbox">收件箱</option>
            <option value="sent">已发送</option>
            <option value="outbox">发件箱</option>
            <option value="failed">发件失败</option>
            <option value="trash">垃圾箱</option>
            <option value="all">全部邮件</option>
          </select>
        </label>
        <div id="message-list" class="message-list" aria-live="polite"></div>
      </section>

      <section id="detail-panel" class="detail-panel glass" aria-label="邮件详情">
        <div id="message-detail" class="message-detail">
          <div class="empty-state"><span class="empty-copy">选择一封邮件查看内容</span></div>
        </div>
      </section>

      <section id="routing-panel" class="routing-panel glass" aria-label="邮箱设置" hidden>
        <div id="routing-content"></div>
      </section>

      <aside class="mail-artwork" aria-hidden="true">
        <img src="https://cdn.rrrosmontis.icu/rossi/rossi-c6ba909ef9dc.webp" alt="" loading="lazy" decoding="async">
        <span>ROSSI MAIL</span>
      </aside>
    </div>

    <nav class="bottom-nav glass" aria-label="主导航">
      <button type="button" class="bottom-item active" data-action="mail"><svg class="icon"><use href="#i-mail"></use></svg><span>邮件</span></button>
      <button type="button" class="bottom-item" data-action="compose"><svg class="icon"><use href="#i-compose"></use></svg><span>写邮件</span></button>
      <button type="button" class="bottom-item" data-action="routing"><svg class="icon"><use href="#i-settings"></use></svg><span>设置</span></button>
    </nav>
  </div>

  <div id="compose-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="compose-title" hidden>
    <div class="modal-backdrop" data-action="close-compose"></div>
    <section class="compose-card glass">
      <header class="compose-header">
        <h2 id="compose-title">写邮件</h2>
        <button class="icon-button" type="button" data-action="close-compose" title="关闭" aria-label="关闭"><svg class="icon"><use href="#i-close"></use></svg></button>
      </header>
      <form id="compose-form" class="compose-form">
        <div class="compose-scroll">
          <div class="compose-grid">
            <label class="field"><span>发件人</span><input id="compose-from" name="from" type="email" value="no-reply@akaros.si" required></label>
            <label class="field"><span>名称</span><input id="compose-from-name" name="fromName" autocomplete="name"></label>
          </div>
          <label class="field"><span>收件人</span><input id="compose-to" name="to" type="text" inputmode="email" autocomplete="off" required></label>
          <div class="compose-grid">
            <label class="field"><span>抄送</span><input id="compose-cc" name="cc" type="text" inputmode="email" autocomplete="off"></label>
            <label class="field"><span>密送</span><input id="compose-bcc" name="bcc" type="text" inputmode="email" autocomplete="off"></label>
          </div>
          <label class="field"><span>主题</span><input id="compose-subject" name="subject" type="text"></label>
          <label class="field body-field"><span>正文</span><textarea id="compose-text" name="text" rows="12"></textarea></label>
          <input id="compose-in-reply-to" name="inReplyTo" type="hidden">
          <input id="compose-references" name="references" type="hidden">
          <div class="attachment-editor">
            <label class="button subtle file-button" for="compose-files"><svg class="icon"><use href="#i-paperclip"></use></svg>附件</label>
            <input id="compose-files" class="file-input" type="file" multiple>
            <span class="attachment-limit">10 MiB</span>
          </div>
          <div id="compose-file-list" class="compose-file-list"></div>
        </div>
        <footer class="compose-footer">
          <button class="button primary" id="send-button" type="submit"><svg class="icon"><use href="#i-send"></use></svg>发送</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
