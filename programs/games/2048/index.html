    .control-grid {

    .control-btn.up {

    .scale-controls {

    .scale-btn {

    /* 移动端适配：修复容器溢出和遮挡问题 */
    @media (max-width: 768px) {

    <script>
        // 新增：游戏状态历史记录
        let gameHistory = [];
        const MAX_HISTORY = 5; // 最大历史记录数
        let currentScore = 0;
        let animationFrameId = null;
        
        // 新增：保存游戏状态
        function saveGameState() {
            // 深拷贝当前游戏状态
            const state = {
                board: JSON.parse(JSON.stringify(board)),
                score: score
            };
            
            // 保存状态到历史记录
            gameHistory.push(state);
            
            // 限制历史记录数量
            if (gameHistory.length > MAX_HISTORY) {
                gameHistory.shift(); // 移除最旧的状态
            }
            
            // 启用撤回按钮
            //document.getElementById('undo-btn').disabled = false;
        }
        
        // 新增：撤回操作
        function undoMove() {
            if (gameHistory.length === 0) return;
            
            // 弹出最近保存的状态
            const lastState = gameHistory.pop();
            
            // 恢复游戏状态
            board = lastState.board;
            score = lastState.score;
            
            // 更新UI
            updateBoard();
            updateScore();
            
            // 如果历史记录为空，禁用撤回按钮
            //if (gameHistory.length === 0) {
            //    document.getElementById('undo-btn').disabled = true;
            //}
        }
        
        // 新增：绑定撤回按钮事件
        document.getElementById('undo-btn').addEventListener('click', undoMove);
        document.getElementById('undo-btn').addEventListener('touchstart', undoMove);
        
        // 新增：添加快捷键支持 (Z)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'z') {
                e.preventDefault();
                undoMove();
            }
        });

        let board = [];
        let score = 0;
        const boardSize = 4;

        function initGame() {
            board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const gameBoard = document.getElementById('game-board');
            gameBoard.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            score = 0;
            currentScore = 0;  // 新增重置
            updateScore();
            addNewNumber();
            addNewNumber();
            updateBoard();
            
            // 新增：重置历史记录
            gameHistory = [];
            //document.getElementById('undo-btn').disabled = true;
        }

        function addNewNumber() {
            const emptyCells = [];
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    if (board[i][j] === 0) emptyCells.push({x: i, y: j});
                }
            }
            if (emptyCells.length > 0) {
                const {x, y} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[x][y] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateBoard() {
            const gameBoard = document.getElementById('game-board');
            const cells = gameBoard.children;
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'game-cell';
                    if (board[i][j] !== 0) {
                        cell.classList.add(`number-${board[i][j]}`);
                        cell.textContent = board[i][j];
                    }
                    gameBoard.appendChild(cell);
                }
            }
        }

         function updateScore() {
            const targetScore = score;
            const startScore = currentScore;
            const duration = 500;
            const startTime = Date.now();

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                currentScore = Math.floor(startScore + (targetScore - startScore) * progress);
                document.getElementById('game-score').textContent = `Score: ${currentScore}`;
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    currentScore = targetScore;
                    animationFrameId = null;
                }
            }
            animate();
        }

        function move(direction) {
            // 新增：在移动前保存当前状态
            saveGameState();
            
            let moved = false;
            const originalBoard = JSON.stringify(board);

            switch(direction) {
                case 'ArrowUp': moved = moveVertical(true); break;
                case 'ArrowDown': moved = moveVertical(false); break;
                case 'ArrowLeft': moved = moveHorizontal(true); break;
                case 'ArrowRight': moved = moveHorizontal(false); break;
            }

            if (moved) {
                addNewNumber();
                updateBoard();
                updateScore();
                checkGameOver();
            } else {
                // 如果没有移动，移除刚才保存的状态
                gameHistory.pop();
                
                // 如果没有历史记录，禁用撤回按钮
                //if (gameHistory.length === 0) {
                //    document.getElementById('undo-btn').disabled = true;
                //}
            }
        }


        function moveVertical(up) {
            let moved = false;
            for (let j = 0; j < boardSize; j++) {
                let column = [];
                for (let i = 0; i < boardSize; i++) column.push(board[i][j]);
                if (!up) column = column.reverse();
                const newColumn = processLine(column, true);
                if (!up) newColumn.reverse();
                for (let i = 0; i < boardSize; i++) {
                    if (board[i][j] !== newColumn[i]) {
                        board[i][j] = newColumn[i];
                        moved = true;
                    }
                }
            }
            return moved;
        }

        function moveHorizontal(left) {
            let moved = false;
            for (let i = 0; i < boardSize; i++) {
                const row = left ? board[i] : [...board[i]].reverse();
                const newRow = processLine(row, true);
                if (!left) newRow.reverse();
                if (JSON.stringify(board[i]) !== JSON.stringify(newRow)) {
                    board[i] = newRow;
                    moved = true;
                }
            }
            return moved;
        }

        function processLine(line, isForward) {
            let arr = line.filter(x => x !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                    arr.push(0); // 填充一个0以保持长度
                }
            }
            while (arr.length < boardSize) {
                arr.push(0);
            }
            return arr;
        }

        function checkGameOver() {
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    if (board[i][j] === 0) return false;
                    if (i < boardSize - 1 && board[i][j] === board[i + 1][j]) return false;
                    if (j < boardSize - 1 && board[i][j] === board[i][j + 1]) return false;
                }
            }
            alert('Game Over!');
            return true;
        }

         document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                move(e.key);
            }
        });

        initGame();

        // 添加移动端控制
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                move(e.target.dataset.direction);
            });
            btn.addEventListener('click', (e) => { // 添加点击事件支持桌面调试
                move(e.target.dataset.direction);
            });
        });

    </script>

    <script>
        // 添加缩放控制逻辑
        let scale = 0.8;  // 默认缩放值改为0.9（原1.0减去0.1步长）
        const gameContainer = document.getElementById('game-container');
        const minScale = 0.7;  // 最小缩放比例
        const maxScale = 1.3;  // 最大缩放比例
        const scaleStep = 0.1; // 缩放步长
        
        function updateScale(newScale) {
            scale = Math.min(Math.max(newScale, minScale), maxScale);
            
            // 检测是否为移动端（屏幕宽度小于等于768px）
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                // 移动端：不移位（因为使用相对定位），只应用缩放
                gameContainer.style.transform = `scale(${scale})`;
            } else {
                // 桌面端：居中+缩放
                gameContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }
        }
        
        // 初始化应用默认缩放
        // 检测是否为移动端，是则不应用初始transform（因为CSS中已移除transform）
        if (window.innerWidth > 768) {
            updateScale(0.9);
        } else {
            // 移动端初始化为1.0，不进行缩放
            scale = 1.0
            gameContainer.style.transform = 'scale(1)';
        }
        
        document.getElementById('zoom-in').addEventListener('click', () => {
            updateScale(scale + scaleStep);
        });
        
        document.getElementById('zoom-out').addEventListener('click', () => {
            updateScale(scale - scaleStep);
        });
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '+') {
                updateScale(scale + scaleStep);
                e.preventDefault();
            }
            if (e.ctrlKey && e.key === '-') {
                updateScale(scale - scaleStep);
                e.preventDefault();
            }
        });
        
        // 监听窗口大小变化，调整缩放状态
        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth <= 768;
            if (!isMobile && gameContainer.style.transform === 'scale(1)') {
                // 从移动端切换到桌面端，恢复居中transform
                updateScale(scale);
            } else if (isMobile && gameContainer.style.transform.includes('translate')) {
                // 从桌面端切换到移动端，移除translate
                gameContainer.style.transform = `scale(${scale})`;
            }
        });
    </script>
