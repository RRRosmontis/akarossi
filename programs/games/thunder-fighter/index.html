<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1e">
<title>雷霆战机 · Thunder Fighter</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="420" height="720"></canvas>

  <div id="hud-buttons">
    <button id="btn-mute" title="静音 (M)" aria-label="静音">
      <svg class="ic ic-on" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg class="ic ic-off" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg>
    </button>
    <button id="btn-pause" title="暂停 (P)" aria-label="暂停">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>

  <button id="btn-bomb" title="炸弹 (空格)">
    <img class="bomb-img" src="assets/pow_bomb.png" alt="炸弹">
    <span id="bomb-count">2</span>
  </button>

  <div id="title-screen" class="overlay">
    <h1 class="game-title">雷霆战机</h1>
    <p class="subtitle">THUNDER FIGHTER</p>
    <div class="instructions">
      <p><b>移动</b>：方向键 / WASD / 触屏拖动</p>
      <p><b>射击</b>：自动开火</p>
      <p><b>炸弹</b>：空格 / Z / 右下角按钮</p>
      <p><b>暂停</b>：P &nbsp; <b>静音</b>：M</p>
      <p class="tip">
        击落敌机掉落补给：
        <img class="ico" src="assets/pow_weapon.png" alt="火力"> 火力
        <img class="ico" src="assets/pow_shield.png" alt="护盾"> 护盾
        <img class="ico" src="assets/pow_bomb.png" alt="炸弹"> 炸弹
        <img class="ico" src="assets/pow_life.png" alt="生命"> 生命
      </p>
      <p class="tip">
        <img class="ico" src="assets/pow_missile.png" alt="导弹"> 追踪导弹
        <img class="ico" src="assets/pow_score.png" alt="双倍分"> 双倍分数
        <img class="ico" src="assets/pow_slow.png" alt="时缓"> 时间减缓
        <img class="ico" src="assets/pow_drone.png" alt="僚机"> 僚机支援
      </p>
    </div>
    <button id="btn-start" class="big-btn">开始游戏</button>
    <p class="best-line">最高分：<span id="title-best">0</span></p>
    <p class="credits">Art &amp; SFX: Kenney (CC0) · Built with Canvas 2D</p>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 class="game-title small">游戏结束</h1>
    <p class="score-line">得分 <span id="final-score">0</span></p>
    <p class="score-line best">最高 <span id="best-score">0</span></p>
    <p id="new-record" class="new-record hidden">★ 新纪录 ★</p>
    <button id="btn-restart" class="big-btn">再来一局</button>
  </div>

  <div id="pause-screen" class="overlay hidden">
    <h1 class="game-title small">已暂停</h1>
    <button id="btn-resume" class="big-btn">继续游戏</button>
  </div>

  <div id="loading-screen" class="overlay">
    <p class="loading-text">加载中…</p>
    <div id="loading-bar"><div id="loading-fill"></div></div>
  </div>
</div>
<script src="game.js?v=6"></script>
</body>
</html>
